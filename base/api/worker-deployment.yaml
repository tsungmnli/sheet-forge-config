# 작업자: 사진 보정·문제 칸 분할·읽기(LLM)·그림 정리와 정기 정리를 한다. API 와 같은 이미지, 명령만 다르다.
# 이게 없으면 사진을 올려도 처리되지 않는다. jobs 테이블을 FOR UPDATE SKIP LOCKED 로 가져가므로
# 늘려도 안전하지만(정기 정리는 각자 돈다) 처음에는 1개로 시작한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  labels:
    app.kubernetes.io/part-of: sheet-forge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  replicas: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: sheet-forge
    spec:
      containers:
        - name: worker
          image: tsungmn/sheet-forge-api
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          # OpenCV 로 큰 사진(최대 20MB)을 다루므로 API 보다 메모리를 넉넉히 둔다.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
