apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  # 무상태라 2개 이상 권장(설계 10장). 한쪽이 재시작돼도 서비스가 끊기지 않는다.
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - image: tsungmn/sheet-forge-api
          imagePullPolicy: Always
          name: api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          # liveness 는 외부 의존성(DB)을 보지 않는다. readiness 만 /readyz (설계 3.1, 10장).
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          # 요청 본문 최대 32MB(base64 이미지 포함) × 워커 2개를 감안해 메모리 한도를 넉넉히 둔다.
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
