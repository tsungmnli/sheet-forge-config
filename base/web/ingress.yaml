# api-ingress 와 같은 호스트·같은 TLS Secret(gitops-tls)을 쓴다. 두 앱이 같은 네임스페이스여야 인증서가 하나만 발급된다.
# 호스트는 overlays/web/domain.json 이 바꾼다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-tsungmn"
spec:
  tls:
    - hosts:
        - sth.sheet-forge.tsungmn.com
      secretName: gitops-tls
  rules:
    - host: sth.sheet-forge.tsungmn.com
      http:
        paths:
          - backend:
              service:
                name: web-service
                port:
                  number: 80
            path: /
            pathType: Prefix
