apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # 웹과 API 가 같은 호스트(sheet.tsungmn.com)라 CORS 는 필요 없다.
  SHEET_FORGE_CORS_ORIGINS: ""
  SHEET_FORGE_WEB_BASE_URL: "https://sheet.tsungmn.com"
  # 로그인 필수. 끄면 누구나 한 명의 기본 소유자로 들어온다. 운영에서는 항상 "1".
  SHEET_FORGE_AUTH_REQUIRED: "1"
  SHEET_FORGE_COOKIE_SECURE: "true"
  # 이미지 저장소(MinIO). S3 API 포트(보통 9000)를 확인할 것. 키는 api-secret.
  SHEET_FORGE_MINIO_ENDPOINT: "api.minio.scg.skku.ac.kr:443"
  SHEET_FORGE_MINIO_BUCKET: "sheet-forge-tsungmn-prod"
  SHEET_FORGE_MINIO_SECURE: "true"
  # fake 면 사진 처리가 가짜 결과. real 이면 LLM 키가 필요하고 사진 축소본·문제 크롭이 외부 LLM 으로 나간다.
  SHEET_FORGE_RECOGNITION_ENGINE: "real"
  # 메일(Resend SMTP). 발신 도메인(sheet.tsungmn.com)이 Resend 에서 인증돼 있어야 메일이 간다.
  SHEET_FORGE_SMTP_HOST: "smtp.resend.com"
  SHEET_FORGE_SMTP_PORT: "465"
  SHEET_FORGE_SMTP_USER: "resend"
  SHEET_FORGE_SMTP_FROM: "sheet-forge <noreply@sheet.tsungmn.com>"
  # 아래는 기본값과 같다. 바꿀 때만 고친다(요청 본문을 올리면 Ingress 의 proxy-body-size 도 같이).
  SHEET_FORGE_MAX_PROBLEMS: "200"
  SHEET_FORGE_MAX_FIGURES: "200"
  SHEET_FORGE_MAX_IMAGE_BYTES: "5242880"
  SHEET_FORGE_MAX_BODY_BYTES: "33554432"
  # uvicorn 워커 수(Dockerfile 기본 2). CPU/메모리 한도와 맞춰서 조정.
  WEB_CONCURRENCY: "2"
