# 값은 Vault(kv/sheet-forge-tsungmn)에 있고 argocd-vault-plugin 이 렌더링 때 채운다.
# KV v2 면 kv/data/..., v1 이면 kv/... 문법. 키가 하나라도 없으면 렌더링이 실패한다.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  SHEET_FORGE_DATABASE_URL: "<path:kv/data/sheet-forge-tsungmn#DATABASE_URL | base64encode>"
  SHEET_FORGE_MINIO_ACCESS_KEY: "<path:kv/data/sheet-forge-tsungmn#MINIO_ACCESS_KEY | base64encode>"
  SHEET_FORGE_MINIO_SECRET_KEY: "<path:kv/data/sheet-forge-tsungmn#MINIO_SECRET_KEY | base64encode>"
  SHEET_FORGE_LLM_API_KEY: "<path:kv/data/sheet-forge-tsungmn#LLM_API_KEY | base64encode>"
  SHEET_FORGE_SMTP_PASSWORD: "<path:kv/data/sheet-forge-tsungmn#SMTP_PASSWORD | base64encode>"
